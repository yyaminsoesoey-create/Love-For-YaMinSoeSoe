
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Yamin Soe Soe ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: sans-serif;
  background: linear-gradient(135deg,#ffb6c1,#ffe4e1);
  color: #d6336c;
}
.card {
  background: white;
  padding: 30px 20px;
  margin: 20px;
  border-radius: 25px;
  box-shadow: 0 8px 25px #d6336c55;
}
h1 { color: #ff4081; }
button {
  background: #ff4081;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 30px;
  font-size: 17px;
}
#message {
  display: none;
  line-height: 2;
  margin-top: 20px;
}
.heart { font-size: 35px; }
</style>
</head>
<body>
<div class="card">
  <div class="heart">💗💕💗</div>
  <h1>ယမင်းစိုးစိုးရေ ❤️</h1>
  <p>မင်းအတွက် အထူးလက်ဆောင်လေးပါ 🥰</p>
  <button onclick="showLove()">ဖွင့်ကြည့်ပါ 💌</button>
  <div id="message">
    <h2>ချစ်စရာကောင်မလေးရေ 💕</h2>
    မင်းကို သဘောကျနေတဲ့သူတစ်ယောက်ရှိတယ်နော်။<br>
    မင်းရဲ့အပြုံးလေးက အရမ်းလှတယ် ❤️<br>
    မင်းကို ပျော်ရွှင်စေချင်ပါတယ်။ 🥰
    <h3>From - လွင်မိုးဦး 💗</h3>
    💖💖💖
  </div>
</div>
<script>
function showLove() {
  document.getElementById("message").style.display = "block";
}
</script>
</body>
</html>
